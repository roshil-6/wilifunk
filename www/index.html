<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#040914"><meta name="description" content="Pilot a tiny spacecraft into a vast, increasingly dangerous universe.">
<title>SPACEHULL — Go further</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=explore-waves-4">
</head>
<body><main id="app" aria-label="SPACEHULL game">
<canvas id="universe" width="390" height="780" aria-label="Space flight. Explore: steer left and right. Tap and Fun: tap or press Space to rise."></canvas>
<div id="hud" hidden><div class="fuel"><span>FUEL <b id="fuelValue">100%</b></span><div class="fuel-track"><i id="fuelFill"></i></div></div><div class="telemetry"><strong class="gold">◉ <span id="coins">0</span></strong><small id="danger">EARTH ORBIT</small><span id="flightStatus"></span></div><button id="pause" aria-label="Pause game">Ⅱ</button><div class="distance"><span id="distance">0</span><small>METERS FROM HOME</small><div class="explore-score"><small>SKILL SCORE</small><span id="skillScore">0</span> <b id="multiplier"></b></div></div><div class="item-hud" id="exploreItemHud"></div></div>
<div id="tapHud" hidden><div class="tap-score"><small>SCORE</small><strong id="tapScore">0</strong><span id="tapBest">BEST 0</span></div><strong class="tap-coins">◉ <span id="tapCoins">0</span></strong><span id="tapFlightStatus"></span><button id="tapPause" aria-label="Pause Tap and Fun">Ⅱ</button><div class="item-hud" id="tapItemHud"></div></div>
<button id="abilityButton" hidden></button><div id="eventBanner"></div><div id="toast" role="status"></div><div id="steerHint"></div>
<div id="arrows" hidden><button data-direction="-1" aria-label="Steer left">〈 <span>LEFT</span></button><button data-direction="1" aria-label="Steer right"><span>RIGHT</span> 〉</button></div>
<div id="flightProgress" hidden><div class="flight-progress-head"><span id="flightRegion"></span><span id="flightCraft"></span></div><div class="journey-track"><i id="journeyFill"></i></div><span id="nextMilestone"></span></div><div id="studioIntro" class="studio-intro"><div class="studio-content"><img src="honeypot_logo.png" alt="Honeypot Gaming" class="studio-logo"><div class="studio-text">HONEYPOT GAMING</div></div></div>
<section id="screen"></section><div id="storageNotice" role="status" hidden>Storage unavailable · progress lasts this session</div>
</main><script type="module" src="game.js?v=explore-waves-4"></script></body></html>
